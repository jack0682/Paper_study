name: Research checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-dco.sh "$BASE" "$HEAD_SHA"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - run: python3 -m venv "$RUNNER_TEMP/lint"
      - run: |
          "$RUNNER_TEMP/lint/bin/pip" install -r .github/lint-requirements.txt
      - run: PATH="$RUNNER_TEMP/lint/bin:$PATH" bash scripts/lint.sh
