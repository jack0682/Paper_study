name: Research checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-dco.sh "$BASE" "$HEAD_SHA"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - run: python3 -m venv "$RUNNER_TEMP/lint"
      - run: |
          "$RUNNER_TEMP/lint/bin/pip" install -r .github/lint-requirements.txt
      - name: Run document linters
        run: PATH="$RUNNER_TEMP/lint/bin:$PATH" bash scripts/lint.sh
  manuscript:
    name: Manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-science texlive-humanities texlive-plain-generic \
            texlive-font-utils ghostscript
      - name: Build main.tex
        working-directory: manuscript/axioms
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
